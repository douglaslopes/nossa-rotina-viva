     NOSSA ROTINA VIVA — app do casal (Douglas 💙 & Mayara 💗)
     ------------------------------------------------------------
     COMO PUBLICAR (GitHub Pages):
     1. Crie um projeto no Firebase Console (console.firebase.google.com).
     2. Build → Authentication → Começar → ative o provedor "Anônimo".
     3. Build → Firestore Database → Criar banco de dados.
        IMPORTANTE: cole as regras abaixo em Firestore → Regras → Publicar.
     4. Configurações do Projeto → Seus apps → Web (</>) → copie o
        objeto de configuração e substitua o "firebaseConfig" abaixo.
     5. Suba este index.html num repositório e ative o GitHub Pages.
     6. Abra a URL no celular, crie o PIN na primeira vez e pronto.
     7. Instale como app:
        - Android/Chrome: menu ⋮ → "Adicionar à tela inicial".
        - iPhone/Safari: compartilhar → "Adicionar à Tela de Início".

     REGRAS DO FIRESTORE (obrigatório — cole no Console):
     ------------------------------------------------------------
     rules_version = '2';
     service cloud.firestore {
       match /databases/{database}/documents {
         match /{document=**} {
           allow read, write: if request.auth != null;
         }
       }
     }
     ------------------------------------------------------------
     Seus dados ficam na sua conta Firebase. Só vocês dois têm acesso. 🔒
     ============================================================ -->

/* ============================================================

   ============================================================ */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import {
  getAuth, signInAnonymously, onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import {
  initializeFirestore, persistentLocalCache, persistentMultipleTabManager,
  doc, getDoc, setDoc, updateDoc, deleteDoc, addDoc,
  collection, orderBy, limit, onSnapshot, getDocs,
  serverTimestamp, writeBatch
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

/* ============================================================
   1. CONFIGURAÇÃO DO FIREBASE
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyBqirYTZyLWjD84-e3NnDyNyiH7-97vK_4",
  authDomain: "nossa-rotina-viva.firebaseapp.com",
  projectId: "nossa-rotina-viva",
  storageBucket: "nossa-rotina-viva.firebasestorage.app",
  messagingSenderId: "563838100404",
  appId: "1:563838100404:web:974f6dd684e50af21908e1",
  measurementId: "G-DMNY2KT0EN"
};

const FIREBASE_CONFIGURADO =
  !!firebaseConfig.apiKey &&
  !firebaseConfig.apiKey.includes("SUA_API_KEY") &&
  !!firebaseConfig.projectId &&
  !firebaseConfig.projectId.includes("SEU_PROJETO");

/* Inicialização robusta: alguns navegadores móveis (Safari iOS,
   navegadores in-app, modo privado) bloqueiam IndexedDB. Nesses
   casos, caímos para cache em memória para não travar o app. */
let app = null, auth = null, db = null;

if (FIREBASE_CONFIGURADO) {
  try {
    app = initializeApp(firebaseConfig);
    auth = getAuth(app);
    try {
      db = initializeFirestore(app, {
        localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() })
      });
    } catch (eCache) {
      db = initializeFirestore(app, {});
    }
  } catch (eInit) {
    app = null; auth = null; db = null;
  }
}

   2. CONSTANTES DO APP

function dataISO(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const dia = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${dia}`;
}
function hojeISO() { return dataISO(new Date()); }
function inicioDoDia(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function paraData(v) {
  if (!v) return null;
  if (v instanceof Date) return v;
  if (typeof v.toDate === "function") return v.toDate();
  const d = new Date(v);
  return isNaN(d.getTime()) ? null : d;
}
function formatarDataLonga(d) {
  const dias = ["domingo","segunda","terça","quarta","quinta","sexta","sábado"];
  const meses = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
  return `${dias[d.getDay()]}, ${d.getDate()} de ${meses[d.getMonth()]}`;
}
function formatarDataCurta(iso) {
  const [a, m, d] = iso.split("-");
  return `${d}/${m}`;
}
function escaparHTML(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#039;");
}
function agoraHHMM() {
  const d = new Date();
  return `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
}

let ctxAudio = null;
function obterCtx() {
  if (!ctxAudio) {
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ctxAudio = new AC();
    } catch (e) { return null; }
  }
  if (ctxAudio.state === "suspended") { ctxAudio.resume().catch(() => {}); }
  return ctxAudio;
}
function tocarNota(freq, atraso, duracao, tipo = "sine", volume = 0.16) {
  const ctx = obterCtx();
  if (!ctx) return;
  const t0 = ctx.currentTime + atraso;
  const osc = ctx.createOscillator();
  const gan = ctx.createGain();
  osc.type = tipo;
  osc.frequency.setValueAtTime(freq, t0);
  gan.gain.setValueAtTime(0.0001, t0);
  gan.gain.exponentialRampToValueAtTime(volume, t0 + 0.02);
  gan.gain.exponentialRampToValueAtTime(0.0001, t0 + duracao);
  osc.connect(gan);
  gan.connect(ctx.destination);
  osc.start(t0);
  osc.stop(t0 + duracao + 0.05);
}

function soltarConfete() {
  try {
    const canvas = $("#confetti-canvas");
    const ctx = canvas.getContext("2d");
    const dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const cores = ["#E08AA6", "#C9B8E8", "#A8D8C8", "#F2E8D5", "#4A90D9", "#F6DDE5"];
    const pecas = [];
    for (let i = 0; i < 70; i++) {
      pecas.push({
        x: window.innerWidth / 2 + (Math.random() - 0.5) * 140,
        y: -20 - Math.random() * 160,
        w: 5 + Math.random() * 6,
        h: 8 + Math.random() * 8,
        vy: 1.6 + Math.random() * 2.4,
        vx: (Math.random() - 0.5) * 1.6,
        rot: Math.random() * Math.PI,
        vrot: (Math.random() - 0.5) * 0.16,
        cor: cores[Math.floor(Math.random() * cores.length)],
        op: 0.9
      });
    }
    let frames = 0;
    function animar() {
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      let vivas = 0;
      pecas.forEach((p) => {
        if (p.y > window.innerHeight + 40) return;
        vivas++;
        p.y += p.vy; p.x += p.vx; p.rot += p.vrot;
        if (frames > 70) p.op = Math.max(0, p.op - 0.012);
        ctx.save();
        ctx.globalAlpha = p.op;
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.cor;
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();
      });
      frames++;
      if (vivas > 0 && frames < 190) requestAnimationFrame(animar);
      else ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    }
    animar();
  } catch (e) { /* silencioso */ }
}

function calcularGravidez(dumValor) {
  const dum = paraData(dumValor);
  if (!dum) return null;
  const hoje = inicioDoDia(new Date());
  const base = inicioDoDia(dum);
  const MS_DIA = 86400000;
  const totalDias = Math.floor((hoje - base) / MS_DIA);
  const semanas = Math.floor(totalDias / 7);
  const dias = totalDias % 7;
  const dataPrevista = new Date(base.getTime() + 280 * MS_DIA);
  const diasRestantes = Math.max(0, Math.round((inicioDoDia(dataPrevista) - hoje) / MS_DIA));
  const semanasRestantes = Math.max(0, Math.ceil(diasRestantes / 7));
  const trimestre = semanas < 13 ? 1 : (semanas < 27 ? 2 : 3);
  const semanaTabela = Math.min(40, Math.max(1, semanas));
  return {
    dum: base, totalDias: Math.max(0, totalDias), semanas: Math.max(0, semanas), dias: Math.max(0, dias),
    dataPrevista, diasRestantes, semanasRestantes, trimestre, semanaTabela,
    texto: `${Math.max(0, semanas)} ${Math.max(0, semanas) === 1 ? "semana" : "semanas"} e ${Math.max(0, dias)} ${Math.max(0, dias) === 1 ? "dia" : "dias"}`
  };
}
function infoBebe(semana) {
  const s = Math.min(40, Math.max(1, semana));
  return APP_CONFIG.tamanhos[s] || APP_CONFIG.tamanhos[1];
}
function diasJuntos() {
  if (!estado.config || !estado.config.data_juntos) return 0;
  const d = paraData(estado.config.data_juntos);
  if (!d) return 0;
  return Math.max(0, Math.floor((inicioDoDia(new Date()) - inicioDoDia(d)) / 86400000));
}

/* ============================================================
   8. PROGRESSO / METAS / STREAKS
   ============================================================ */
function metaAgua(pessoa) {
  const m = estado.config && estado.config.meta_agua_ml;
  return (m && m[pessoa]) || 2500;
}
function metaIngles(pessoa) {
  const m = estado.config && estado.config.meta_ingles_min;
  return (m && m[pessoa]) || 20;
}
function metaPomodoros(pessoa) {
  const m = estado.config && estado.config.meta_pomodoros;
  return (m && m[pessoa]) || 4;
}
function obterDia(pessoa, data) {
  return estado.dias.find((d) => d.pessoa === pessoa && d.data === data) || null;
}
function progressoDia(dia, pessoa) {
  if (!dia) return 0;
  const agua = Math.min(1, (dia.agua_ml || 0) / metaAgua(pessoa)) * 25;
  /* Refeições: 3 já bate a meta; as outras 3 são bônus */
  const refeicoes = Math.min(1, ((dia.refeicoes || []).length) / 3) * 20;
  const exercicio = dia.exercicio ? 10 : 0;
  const ingles = Math.min(1, (dia.ingles_minutos || 0) / metaIngles(pessoa)) * 15;
  const pomodoros = Math.min(1, ((dia.pomodoros_trabalho || 0) + (dia.pomodoros_estudo || 0)) / metaPomodoros(pessoa)) * 20;
  const ev = dia.evitou || {};
  const qtdEv = APP_CONFIG.evitaveis.filter((e) => ev[e.id]).length;
  const evitou = (qtdEv / APP_CONFIG.evitaveis.length) * 10;
  return Math.round(Math.min(100, agua + refeicoes + exercicio + ingles + pomodoros + evitou));
}
function calcularStreak(pessoa, tipo = "geral") {
  const mapa = {};
  estado.dias.filter((d) => d.pessoa === pessoa).forEach((d) => { mapa[d.data] = d; });
  let d = new Date();
  if (!mapa[dataISO(d)]) d.setDate(d.getDate() - 1);
  let streak = 0;
  for (let i = 0; i < 400; i++) {
    const iso = dataISO(d);
    const doc = mapa[iso];
    if (!doc) break;
    const ok = tipo === "agua"
      ? (doc.agua_ml || 0) >= metaAgua(pessoa)
      : progressoDia(doc, pessoa) >= 60;
    if (!ok) break;
    streak++;
    d.setDate(d.getDate() - 1);
  }
  return streak;
}
function calcularRecorde(pessoa, tipo = "geral") {
  const mapa = {};
  estado.dias.filter((d) => d.pessoa === pessoa).forEach((d) => { mapa[d.data] = d; });
  const datas = Object.keys(mapa).sort();
  let melhor = 0, atual = 0, anterior = null;
  datas.forEach((iso) => {
    const doc = mapa[iso];
    const ok = tipo === "agua"
      ? (doc.agua_ml || 0) >= metaAgua(pessoa)
      : progressoDia(doc, pessoa) >= 60;
    if (ok) {
      if (anterior) {
        const diff = (new Date(iso) - new Date(anterior)) / 86400000;
        atual = diff === 1 ? atual + 1 : 1;
      } else atual = 1;
      melhor = Math.max(melhor, atual);
    } else { atual = 0; }
    anterior = iso;
  });
  return melhor;
}

const REF_CONFIG = () => doc(db, "config", "casal");

const refSemana = (semana) => doc(db, "semanas_gravidez", String(semana));

/* Mensagem de erro clara para qualquer falha de escrita */
function mensagemErroFirestore(e) {
  const codigo = (e && e.code) ? String(e.code) : "";
  if (!navigator.onLine) {
    return "Tô sem conexão. Quando voltar, atualizo tudo 💙";
  }
  if (codigo.includes("permission") || codigo.includes("unauthenticated")) {
    return "O Firestore está bloqueando. Confere as regras no Console 🔒";
  }
  if (codigo.includes("unavailable")) {
    return "Servidor indisponível agora. Tenta em instantes 💙";
  }
  return "Não consegui salvar agora. Tenta de novo 💙";
}

async function salvarConfig(parcial, aviso = "Salvo 💚") {
  if (!db) { toast("Firebase não configurado 💙", 3000); return false; }
  try {
    await setDoc(REF_CONFIG(), { ...parcial, atualizado_em: serverTimestamp() }, { merge: true });
    if (aviso) toast(aviso);
    return true;
  } catch (e) {
    toast(mensagemErroFirestore(e), 4000);
    return false;
  }
}

async function salvarDia(pessoa, data, dados, aviso = "Anotado 💚") {
  if (!db) { toast("Firebase não configurado 💙", 3000); return false; }
  try {
    /* setDoc com merge cria ou atualiza em uma única chamada — mais robusto */
    await setDoc(refDia(pessoa, data), {
      pessoa,
      data,
      ...dados,
      atualizado_em: serverTimestamp()
    }, { merge: true });

/* ============================================================
   11. OUVINTES EM TEMPO REAL
   ============================================================ */
function iniciarOuvintes() {
  if (estado.ouvintesAtivos || !db) return;
  estado.ouvintesAtivos = true;

  onSnapshot(REF_CONFIG(), (snap) => {
    if (!snap.exists()) {
      estado.configCarregada = true;
      $("#tela-loading").classList.add("oculto");
      abrirConfiguracaoInicial();
      return;
    }
    const anterior = estado.config;
    estado.config = snap.data();
    estado.configCarregada = true;

    $("#tela-loading").classList.add("oculto");

    if (anterior && anterior.dum && estado.config.dum) {
      const gAntes = calcularGravidez(anterior.dum);
      const gAgora = calcularGravidez(estado.config.dum);
      if (gAntes && gAgora && gAntes.semanas !== gAgora.semanas) {
        Sons.semanaBebe();
        toast(`Nova semana do bebê: ${infoBebe(gAgora.semanaTabela).e} ${infoBebe(gAgora.semanaTabela).t} 💗`, 3600);
      }
    }

    const sessao = sessionStorage.getItem(CHAVE_SESSAO);
    if (sessao && !estado.pessoa) {
      entrarNoApp(sessao);
    } else if (!sessao && !estado.pessoa) {
      mostrarLogin();
    }

    atualizarCabecalho();
    renderizarTelaAtual();
  }, () => {
    $("#tela-loading").classList.add("oculto");
    toast("Tô sem conexão, mas quando voltar atualizo tudo 💙", 3600);
    if (!estado.pessoa) mostrarLogin();
  });

  onSnapshot(collection(db, "dias"), (snap) => {
    estado.dias = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    aplicarModoDificil();
    renderizarTelaAtual();
  }, () => {});

  onSnapshot(collection(db, "semanas_gravidez"), (snap) => {
    estado.semanas = snap.docs.map((d) => ({ id: d.id, ...d.data() }))
      .sort((a, b) => (b.semana || 0) - (a.semana || 0));
    renderizarTelaAtual();
  }, () => {});

  onSnapshot(collection(db, "preparacao_papai"), (snap) => {
    estado.preparacao = snap.docs.map((d) => ({ id: d.id, ...d.data() }))
      .sort((a, b) => (a.ordem || 0) - (b.ordem || 0));
    renderizarTelaAtual();
  }, () => {});

  const qSessoes = query(collection(db, "sessoes_pomodoro"), orderBy("criado_em", "desc"), limit(300));
  onSnapshot(qSessoes, (snap) => {
    estado.sessoes = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    renderizarTelaAtual();
  }, () => {
    onSnapshot(collection(db, "sessoes_pomodoro"), (snap2) => {
      estado.sessoes = snap2.docs.map((d) => ({ id: d.id, ...d.data() }));
    }, () => {});
  });
}

function atualizarCabecalho() {
  if (!estado.pessoa) return;
  const h = new Date().getHours();
  const nome = nomePessoa(estado.pessoa);
  let saudacao = "Olá";
  if (h < 5) saudacao = `Boa noite, ${nome}`;
  else if (h < 12) saudacao = `Bom dia, ${nome}`;
  else if (h < 18) saudacao = `Boa tarde, ${nome}`;
  else saudacao = `Boa noite, ${nome}`;
  if (estado.modoDificil && estado.pessoa === "mayara") saudacao = `Bom dia, ${nome} 💗`;
  $("#cabecalho-saudacao").textContent = saudacao;
  $("#cabecalho-data").textContent = formatarDataLonga(new Date());
}

function aplicarModoDificil() {
  const semanas = estado.semanas || [];
  const atual = semanas.length ? semanas[0] : null;
  const ativo = !!(atual && (atual.humor === "muito_dificil" || atual.humor === "dificil"));
  estado.modoDificil = ativo;
  document.body.classList.toggle("modo-dificil", ativo);
  atualizarCabecalho();
}

function verificarAvisosDaOutraPessoa() {
  const p = estado.pessoa;
  const outro = p === "douglas" ? "mayara" : "douglas";
  const hoje = hojeISO();
  const avisos = [];

  const diaOutro = obterDia(outro, hoje);
  if (diaOutro && diaOutro.humor && (diaOutro.humor === "dificil" || diaOutro.humor === "muito_dificil")) {
    avisos.push(`${nomePessoa(outro)} anotou que o dia foi difícil hoje 💗`);
  }
  if (diaOutro && (diaOutro.agua_ml || 0) >= metaAgua(outro)) {
    avisos.push(`${nomePessoa(outro)} bateu a meta de água hoje! 💧`);
  }
  if (diaOutro && diaOutro.exercicio) {
    avisos.push(`${nomePessoa(outro)} se mexeu hoje! 🧘`);
  }
  if (diaOutro && (diaOutro.ingles_minutos || 0) >= metaIngles(outro)) {
    avisos.push(`${nomePessoa(outro)} estudou inglês hoje! 📚`);
  }
  if (diaOutro && diaOutro.pomodoros_trabalho >= metaPomodoros(outro)) {
    avisos.push(`${nomePessoa(outro)} mandou bem nos focos hoje! 🍅`);
  }

  const semanaAtual = calcularGravidez(estado.config && estado.config.dum);
  if (p === "douglas" && semanaAtual) {
    const s = semanaAtual.semanaTabela;
    const registrada = estado.semanas.find((x) => x.semana === s);
    if (registrada && registrada.o_que_ajuda) {
      avisos.push(`Ela deixou um recadinho: "${String(registrada.o_que_ajuda).slice(0, 80)}" 💙`);
    }
  }

  if (p === "douglas" && estado.semanas.length >= 2) {
    const ordenadas = [...estado.semanas].sort((a, b) => b.semana - a.semana);
    if (ordenadas[0].humor === "muito_dificil" && ordenadas[1].humor === "muito_dificil") {
      avisos.push("Talvez seja bom conversar com o médico e dar um colinho extra 💗");
    }
  }

  estado.avisos = avisos;
  const faixa = $("#faixa-avisos");
  if (!avisos.length) {
    faixa.classList.add("oculto");
    faixa.innerHTML = "";
    return;
  }
  faixa.classList.remove("oculto");
  faixa.innerHTML = `
    <div class="max-w-lg mx-auto px-4 pb-3">
      ${avisos.map((a) => `
        <div class="text-xs font-bold px-3 py-2 rounded-xl mb-1.5 pop-in" style="background:var(--surface-2); color:var(--text); border:1px solid var(--borda)">
          ${escaparHTML(a)}
        </div>`).join("")}
    </div>`;
}

const TELAS = ["home", "diario", "pomodoro", "gravidez", "historico", "config"];

function trocarTela(tela) {
  if (!TELAS.includes(tela)) tela = "home";
  estado.tela = tela;
  TELAS.forEach((t) => {
    const el = $(`#tela-${t}`);
    if (!el) return;
    if (t === tela) {
      el.classList.remove("oculto");
      el.classList.remove("fade-in");
      void el.offsetWidth;
      el.classList.add("fade-in");
    } else {
      el.classList.add("oculto");
    }
  });
  $$(".nav-btn").forEach((b) => b.classList.toggle("ativo", b.dataset.tela === tela));
  window.scrollTo({ top: 0, behavior: "smooth" });
  renderizarTelaAtual();
}

function renderizarTelaAtual() {
  if (!estado.pessoa || !estado.config) return;
  switch (estado.tela) {
    case "home": renderizarHome(); break;
    case "diario": renderizarDiario(); break;
    case "pomodoro": renderizarPomodoro(); break;
    case "gravidez": renderizarGravidez(); break;
    case "historico": renderizarHistorico(); break;
    case "config": renderizarConfig(); break;
  }
}

let aguaLocal = null;
let aguaLocalData = null;

function renderizarDiario() {
  const p = estado.pessoa;
  const data = hojeISO();
  const dia = obterDia(p, data) || {};
  const cfg = estado.config;

  /* Sincroniza água local só quando muda o dia ou quando o servidor traz valor maior */
  if (aguaLocalData !== data) {
    aguaLocal = dia.agua_ml || 0;
    aguaLocalData = data;
  } else if (typeof dia.agua_ml === "number" && dia.agua_ml > aguaLocal) {
    aguaLocal = dia.agua_ml;
  }

  const refeicoesFeitas = (dia.refeicoes || []).map((r) => r.tipo);
  const evitou = dia.evitou || {};

  /* NOVO: 6 refeições */
  const refeicoesHTML = APP_CONFIG.refeicoes.map((r) => `
    <button class="toggle-item w-full mb-2 ${refeicoesFeitas.includes(r.id) ? "ativo" : ""}" data-refeicao="${r.id}">
      <span class="flex items-center gap-2 text-sm">${r.e} ${escaparHTML(r.t)}</span>
      <span class="toggle-dot"><i class="fa-solid fa-check"></i></span>
    </button>`).join("");

  /* NOVO: 6 evitáveis */
  const evitaveisHTML = APP_CONFIG.evitaveis.map((e) => `
    <button class="toggle-item w-full mb-2 ${evitou[e.id] ? "ativo" : ""}" data-evitavel="${e.id}">
      <span class="flex items-center gap-2 text-sm">${e.e} ${escaparHTML(e.t)}</span>
      <span class="toggle-dot"><i class="fa-solid fa-check"></i></span>
    </button>`).join("");

  const humoresHTML = APP_CONFIG.humores.map((h) => `
    <button class="humor-btn ${dia.humor === h.id ? "ativo" : ""}" data-humor="${h.id}">
      <span class="emo">${h.e}</span>
      <span class="txt">${escaparHTML(h.t)}</span>
    </button>`).join("");

  const pomT = dia.pomodoros_trabalho || 0;
  const pomE = dia.pomodoros_estudo || 0;

  $("#tela-diario").innerHTML = `
    <div class="stagger">
      <div class="mb-4">
        <h2 class="fonte-display text-2xl font-bold">Meu diário de hoje</h2>
        <p class="text-sm" style="color:var(--muted)">${escaparHTML(formatarDataLonga(new Date()))} · ${escaparHTML(nomePessoa(p))}</p>
      </div>

      <div class="cartao mb-3">
        <div class="flex items-center justify-between mb-3">
          <p class="text-xs font-extrabold uppercase tracking-wider" style="color:var(--muted)">💧 Água</p>
          <p class="text-sm font-extrabold" id="agua-valor">${aguaLocal} <span style="color:var(--muted)">/ ${metaAgua(p)} ml</span></p>
        </div>
        <div class="barra mb-3" id="agua-barra"><i style="width:${Math.min(100, Math.round((aguaLocal / metaAgua(p)) * 100))}%; background:linear-gradient(90deg,#7FC7E8,var(--azul))"></i></div>
        <div class="grid grid-cols-3 gap-2 mb-2">
          <button class="btn btn-neutro py-3 text-sm" data-agua="200">+200 ml</button>
          <button class="btn btn-neutro py-3 text-sm" data-agua="300">+300 ml</button>
          <button class="btn btn-neutro py-3 text-sm" data-agua="500">+500 ml</button>
        </div>
        <button class="btn btn-fantasma w-full py-2 text-xs" data-agua="reset">zerar o dia</button>
      </div>

      <div class="cartao mb-3">
        <p class="text-xs font-extrabold uppercase tracking-wider mb-3" style="color:var(--muted)">🍽️ Refeições</p>
        ${refeicoesHTML}
      </div>

      <div class="cartao mb-3">
        <p class="text-xs font-extrabold uppercase tracking-wider mb-1" style="color:var(--muted)">🚫 Hábitos que evitei hoje</p>
        <p class="text-xs mb-3" style="color:var(--muted)">Marque o que você conseguiu deixar de lado. Sem cobrança. 🌿</p>
        ${evitaveisHTML}
      </div>

      <div class="cartao mb-3">
        <p class="text-xs font-extrabold uppercase tracking-wider mb-3" style="color:var(--muted)">🧘 Como estou me sentindo</p>
        <div class="flex gap-2">${humoresHTML}</div>
      </div>

      <div class="cartao mb-3">
        <p class="text-xs font-extrabold uppercase tracking-wider mb-3" style="color:var(--muted)">🌙 Corpo e mente</p>

        <button class="toggle-item w-full mb-2 ${dia.dormiu_bem ? "ativo" : ""}" data-toggle="dormiu_bem">
          <span class="flex items-center gap-2 text-sm">😴 Dormi bem</span>
          <span class="toggle-dot"><i class="fa-solid fa-check"></i></span>
        </button>

        <button class="toggle-item w-full mb-3 ${dia.exercicio ? "ativo" : ""}" data-toggle="exercicio">
          <span class="flex items-center gap-2 text-sm">🏃 Me movimentei</span>
          <span class="toggle-dot"><i class="fa-solid fa-check"></i></span>
        </button>

        <label class="block text-xs font-extrabold uppercase tracking-wider mb-2" style="color:var(--muted)">Acordei às</label>
        <input type="time" class="campo mb-3" id="campo-acordou" value="${escaparHTML(dia.acordou_horario || (cfg.meta_acordar && cfg.meta_acordar[p]) || "")}">

        <label class="block text-xs font-extrabold uppercase tracking-wider mb-2" style="color:var(--muted)">Minutos de inglês</label>
        <input type="number" min="0" max="600" class="campo mb-3" id="campo-ingles" value="${dia.ingles_minutos || 0}" placeholder="0">

        <div class="flex items-center justify-between cartao-suave">
          <div>
            <p class="text-xs font-extrabold uppercase tracking-wider" style="color:var(--muted)">🍅 Focos de hoje</p>
            <p class="text-sm font-bold mt-0.5">${pomT} trabalho · ${pomE} estudo</p>
          </div>
          <button class="btn btn-neutro px-4 py-2 text-xs" data-acao="ir-pomodoro">Focar</button>
        </div>
      </div>

      <div class="cartao mb-4">
        <label class="block text-xs font-extrabold uppercase tracking-wider mb-2" style="color:var(--muted)">📝 Anotação livre</label>
        <textarea class="campo" id="campo-anotacao" maxlength="800" placeholder="Como foi o seu dia? Escreve aqui, é só nosso...">${escaparHTML(dia.anotacao || "")}</textarea>
        <p class="text-[0.68rem] mt-1 text-right" style="color:var(--muted)"><span id="contador-anotacao">${(dia.anotacao || "").length}</span>/800</p>
      </div>

      <button class="btn ${p === "douglas" ? "btn-primario" : "btn-rosa"} w-full py-4 text-base mb-6" id="btn-salvar-dia">
        Salvar meu dia 💚
      </button>
    </div>
  `;

  const atualizarAguaUI = () => {
    const el1 = $("#agua-valor"), el2 = $("#agua-barra");
    if (el1) el1.innerHTML = `${aguaLocal} <span style="color:var(--muted)">/ ${metaAgua(p)} ml</span>`;
    if (el2) el2.innerHTML = `<i style="width:${Math.min(100, Math.round((aguaLocal / metaAgua(p)) * 100))}%; background:linear-gradient(90deg,#7FC7E8,var(--azul))"></i>`;
  };

  $$("[data-agua]", $("#tela-diario")).forEach((b) => {
    b.addEventListener("click", async () => {
      const anterior = aguaLocal;
      if (b.dataset.agua === "reset") {
        aguaLocal = 0;
      } else {
        aguaLocal = Math.max(0, aguaLocal + Number(b.dataset.agua));
        Sons.habitoFeito();
        vibrar(18);
      }
      atualizarAguaUI();
      const ok = await salvarDia(p, data, { agua_ml: aguaLocal }, null);
      if (!ok) { aguaLocal = anterior; atualizarAguaUI(); }
      const meta = metaAgua(p);
      if (ok && aguaLocal >= meta && (dia.agua_ml || 0) < meta) {
        soltarConfete();
        toast("Meta de água batida! 💧✨", 3000);
      }
    });
  });

  $$("[data-refeicao]", $("#tela-diario")).forEach((b) => {
    b.addEventListener("click", async () => {
      const tipo = b.dataset.refeicao;
      const atual = obterDia(p, data) || {};
      let lista = [...(atual.refeicoes || [])];
      const existe = lista.some((r) => r.tipo === tipo);
      if (existe) {
        lista = lista.filter((r) => r.tipo !== tipo);
      } else {
        lista.push({ tipo, horario: agoraHHMM() });
        Sons.habitoFeito();
        vibrar(18);
      }
      const anterior = b.classList.contains("ativo");
      b.classList.toggle("ativo", !existe);
      const ok = await salvarDia(p, data, { refeicoes: lista }, null);
      if (!ok) b.classList.toggle("ativo", anterior);
    });
  });

  $$("[data-evitavel]", $("#tela-diario")).forEach((b) => {
    b.addEventListener("click", async () => {
      const id = b.dataset.evitavel;
      const atual = obterDia(p, data) || {};
      const ev = { ...(atual.evitou || {}) };
      ev[id] = !ev[id];
      const anterior = b.classList.contains("ativo");
      b.classList.toggle("ativo", ev[id]);
      if (ev[id]) { Sons.habitoFeito(); vibrar(18); }
      const ok = await salvarDia(p, data, { evitou: ev }, null);
      if (!ok) b.classList.toggle("ativo", anterior);
    });
  });

  $$("[data-humor]", $("#tela-diario")).forEach((b) => {
    b.addEventListener("click", async () => {
      const id = b.dataset.humor;
      const anterior = $$("[data-humor]", $("#tela-diario")).find((x) => x.classList.contains("ativo"));
      $$("[data-humor]", $("#tela-diario")).forEach((x) => x.classList.remove("ativo"));
      b.classList.add("ativo");
      vibrar(18);
      const ok = await salvarDia(p, data, { humor: id }, null);
      if (!ok && anterior) { anterior.classList.add("ativo"); b.classList.remove("ativo"); }
      if (ok && (id === "dificil" || id === "muito_dificil")) {
        toast("Obrigado por dividir. Vai com calma hoje 💗", 3200);
      }
    });
  });

  $$("[data-toggle]", $("#tela-diario")).forEach((b) => {
    b.addEventListener("click", async () => {
      const campo = b.dataset.toggle;
      const atual = obterDia(p, data) || {};
      const novo = !atual[campo];
      const anterior = b.classList.contains("ativo");
      b.classList.toggle("ativo", novo);
      if (novo) { Sons.habitoFeito(); vibrar(18); }
      const ok = await salvarDia(p, data, { [campo]: novo }, null);
      if (!ok) b.classList.toggle("ativo", anterior);
    });
  });

  const campoAnot = $("#campo-anotacao");
  if (campoAnot) {
    campoAnot.addEventListener("input", () => {
      const c = $("#contador-anotacao");
      if (c) c.textContent = campoAnot.value.length;
    });
  }

  const campoIngles = $("#campo-ingles");
  if (campoIngles) {
    campoIngles.addEventListener("change", async () => {
      const v = Math.max(0, Math.min(600, Number(campoIngles.value) || 0));
      campoIngles.value = v;
      await salvarDia(p, data, { ingles_minutos: v }, "Inglês salvo 📚");
    });
  }

  const campoAcordou = $("#campo-acordou");
  if (campoAcordou) {
    campoAcordou.addEventListener("change", async () => {
      await salvarDia(p, data, { acordou_horario: campoAcordou.value || null }, null);
    });
  }

  $("#btn-salvar-dia").addEventListener("click", async () => {
    const atual = obterDia(p, data) || {};
    const dados = {
      agua_ml: aguaLocal,
      anotacao: ($("#campo-anotacao").value || "").slice(0, 800),
      ingles_minutos: Math.max(0, Math.min(600, Number($("#campo-ingles").value) || 0)),
      acordou_horario: $("#campo-acordou").value || null,
      dormiu_bem: !!atual.dormiu_bem,
      exercicio: !!atual.exercicio
    };
    const btn = $("#btn-salvar-dia");
    const original = btn.innerHTML;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Salvando...';
    btn.disabled = true;
    const ok = await salvarDia(p, data, dados, null);
    btn.disabled = false;
    if (ok) {
      Sons.salvar();
      vibrar([18, 40, 18]);
      btn.innerHTML = '<i class="fa-solid fa-check"></i> Salvo!';
      toast("Anotado 💚", 2000);
      setTimeout(() => { btn.innerHTML = original; }, 1500);
      const prog = progressoDia({ ...atual, ...dados }, p);
      if (prog >= 80) {
        soltarConfete();
        toast("Dia lindo! Você cuidou de você hoje ✨", 3000);
      }
    } else {
      btn.innerHTML = original;
    }
  });
}

/* ============================================================
   17. POMODORO
   ============================================================ */
const MODOS_POMODORO = {
  trabalho: { t: "Trabalho", cor: "#4A90D9", icone: "fa-briefcase" },
  estudo:   { t: "Estudo",   cor: "#A8D8C8", icone: "fa-book" },
  ingles:   { t: "Inglês",   cor: "#E08AA6", icone: "fa-language" }
};

function renderizarPomodoro() {
  const pm = estado.pomodoro;
  const cfg = estado.config;
  const p = estado.pessoa;
  const corModo = MODOS_POMODORO[pm.modo] ? MODOS_POMODORO[pm.modo].cor : "#C9B8E8";

  const min = Math.floor(pm.restante / 60);
  const seg = pm.restante % 60;
  const texto = `${String(min).padStart(2, "0")}:${String(seg).padStart(2, "0")}`;
  const progresso = pm.total > 0 ? 1 - (pm.restante / pm.total) : 0;
  const raio = 120;
  const circunferencia = 2 * Math.PI * raio;
  const offset = circunferencia * (1 - progresso);

  const hoje = hojeISO();
  const dia = obterDia(p, hoje) || {};

function definirModoPomodoro(modo) {
  const cfg = estado.config || {};
  const minutos = cfg.pomodoro_minutos || 25;
  estado.pomodoro.modo = modo;
  estado.pomodoro.total = minutos * 60;
  estado.pomodoro.restante = minutos * 60;
  estado.pomodoro.rodando = false;
}

function iniciarPomodoro() {
  const pm = estado.pomodoro;
  if (pm.rodando) return;
  pm.rodando = true;
  pm.fimEm = Date.now() + pm.restante * 1000;
  Sons.pomodoroInicio();
  vibrar([18, 50, 18]);
  toast("Pomodoro iniciado 🍅");
  pm.intervalo = setInterval(() => {
    const restante = Math.round((pm.fimEm - Date.now()) / 1000);
    if (restante <= 0) { finalizarPomodoro(); return; }
    pm.restante = restante;
    atualizarVisorPomodoro();
  }, 250);
  renderizarPomodoro();
}

function pausarPomodoro() {
  const pm = estado.pomodoro;
  if (!pm.rodando) return;
  clearInterval(pm.intervalo);
  pm.intervalo = null;
  pm.rodando = false;
  pm.restante = Math.max(0, Math.round((pm.fimEm - Date.now()) / 1000));
  toast("Pausado ☕");
  renderizarPomodoro();
}

function pararPomodoro() {
  const pm = estado.pomodoro;
  clearInterval(pm.intervalo);
  pm.intervalo = null;
  pm.rodando = false;
}

async function finalizarPomodoro() {
  const pm = estado.pomodoro;
  const p = estado.pessoa;
  const modo = pm.modo;
  const minutos = Math.round(pm.total / 60);
  pararPomodoro();
  Sons.pomodoroFim();
  vibrar([30, 80, 30, 80, 30]);
  notificarNavegador("Foco concluído 🍅", "Boa! Você completou um bloco. Descansa um pouquinho 💙");
  toast("Bloco concluído! Descansa um pouquinho 💙", 3200);

  await registrarSessaoPomodoro({
    pessoa: p, data: hojeISO(), duracao_min: minutos,
    categoria: modo, concluido: true
  });

  const data = hojeISO();
  const dia = obterDia(p, data) || {};
  if (modo === "trabalho") {
    await salvarDia(p, data, { pomodoros_trabalho: (dia.pomodoros_trabalho || 0) + 1 }, null);
  } else if (modo === "estudo") {
    await salvarDia(p, data, { pomodoros_estudo: (dia.pomodoros_estudo || 0) + 1 }, null);
  } else {
    await salvarDia(p, data, {
      pomodoros_estudo: (dia.pomodoros_estudo || 0) + 1,
      ingles_minutos: (dia.ingles_minutos || 0) + minutos
    }, null);
  }

  pm.ciclo = (pm.ciclo || 0) + 1;
  const cfg = estado.config || {};
  const pausaMin = pm.ciclo % 4 === 0 ? (cfg.pausa_longa_minutos || 15) : (cfg.pausa_curta_minutos || 5);
  pm.modo = "pausa";
  pm.total = pausaMin * 60;
  pm.restante = pausaMin * 60;
  pm.rodando = false;
  renderizarPomodoro();
  toast(`Pausa de ${pausaMin} min 💚`, 3000);

  const modoAnterior = modo;
  setTimeout(() => {
    if (estado.pomodoro.modo === "pausa") {
      definirModoPomodoro(modoAnterior);
      renderizarTelaAtual();
    }
  }, pausaMin * 60 * 1000);
}

function atualizarVisorPomodoro() {
  const pm = estado.pomodoro;
  const visor = $("#tela-pomodoro");
  if (!visor || visor.classList.contains("oculto")) return;
  const texto = `${String(Math.floor(pm.restante / 60)).padStart(2, "0")}:${String(pm.restante % 60).padStart(2, "0")}`;
  const el = visor.querySelector(".fonte-display.font-bold");
  if (el) el.textContent = texto;
  const anel = visor.querySelector(".pomo-anel");
  if (anel) {
    const raio = 120;
    const circ = 2 * Math.PI * raio;
    const prog = pm.total > 0 ? 1 - (pm.restante / pm.total) : 0;
    anel.setAttribute("stroke-dashoffset", String(circ * (1 - prog)));
  }
}

        const ok = await atualizarPreparacao(id, { feito: !feito, data_conclusao: !feito ? new Date() : null });
        if (!ok) {
          b.classList.toggle("ativo", anterior);
          if (span) span.classList.toggle("line-through", anterior);
        }
      });
    });

    $$("[data-remover-item]", $("#tela-gravidez")).forEach((b) => {
      b.addEventListener("click", async () => {
        const ok = await confirmar("Remover este item?", "Ele sai do seu checklist de preparação.", "Remover");
        if (ok) await removerPreparacao(b.dataset.removerItem);
      });
    });

    const btnPapai = $("#btn-salvar-papai");
    if (btnPapai) {
      btnPapai.addEventListener("click", async () => {
        const ok = await salvarSemana(grav.semanaTabela, {
          feito_pelo_douglas: ($("#grav-feito").value || "").slice(0, 400),
          data: new Date()
        }, "Registrado 💙");
        if (ok) { Sons.salvar(); vibrar([18, 40, 18]); }
      });
    }
  }
}

function renderizarHistorico() {
  const p = estado.pessoa;
  const agora = new Date();

  const ano = agora.getFullYear();
  const mes = agora.getMonth();
  const primeiroDia = new Date(ano, mes, 1);
  const diasNoMes = new Date(ano, mes + 1, 0).getDate();
  const inicioSemana = primeiroDia.getDay();

  let celulas = "";
  for (let i = 0; i < inicioSemana; i++) celulas += `<div class="cal-dia vazio"></div>`;
  for (let d = 1; d <= diasNoMes; d++) {
    const iso = dataISO(new Date(ano, mes, d));
    const doc = obterDia(p, iso);
    const prog = doc ? progressoDia(doc, p) : -1;
    let classe = "n0";
    if (prog >= 0) classe = prog >= 80 ? "n3" : (prog >= 50 ? "n2" : "n1");
    const ehHoje = iso === hojeISO();
    celulas += `<div class="cal-dia ${classe} ${ehHoje ? "hoje" : ""}">${d}</div>`;
  }

  const nomeMes = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"][mes];

  const streaksHTML = ["douglas", "mayara"].map((pes) => {
    const sGeral = calcularStreak(pes, "geral");
    const sAgua = calcularStreak(pes, "agua");
    const rGeral = calcularRecorde(pes, "geral");
    const cor = pes === "douglas" ? "var(--azul)" : "var(--rosa)";
    return `
      <div class="cartao-suave flex-1">
        <p class="text-xs font-extrabold mb-2" style="color:${cor}">${pes === "douglas" ? "💙" : "💗"} ${escaparHTML(nomePessoa(pes))}</p>
        <p class="text-2xl font-extrabold" style="color:var(--text)">${sGeral} <span class="text-xs font-bold" style="color:var(--muted)">dias</span></p>
        <p class="text-[0.66rem] font-bold mb-2" style="color:var(--muted)">sequência atual</p>
        <p class="text-xs font-bold" style="color:var(--muted)">💧 ${sAgua} dias de água</p>
        <p class="text-xs font-bold" style="color:var(--muted)">🏆 recorde: ${rGeral} dias</p>
      </div>`;
  }).join("");

  const labels30 = [];
  for (let i = 29; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    labels30.push(dataISO(d));
  }
  const aguaDouglas = labels30.map((iso) => { const d = obterDia("douglas", iso); return d ? (d.agua_ml || 0) : null; });
  const aguaMayara = labels30.map((iso) => { const d = obterDia("mayara", iso); return d ? (d.agua_ml || 0) : null; });

  const semanasLabels = [];
  const inglesDouglas = [];
  const inglesMayara = [];
  for (let i = 5; i >= 0; i--) {
    const inicio = new Date();
    inicio.setDate(inicio.getDate() - (inicio.getDay() || 7) + 1 - i * 7);
    const fim = new Date(inicio);
    fim.setDate(fim.getDate() + 6);
    semanasLabels.push(`${inicio.getDate()}/${inicio.getMonth() + 1}`);
    let somaD = 0, somaM = 0;
    estado.dias.forEach((d) => {
      const dd = new Date(`${d.data}T00:00:00`);
      if (dd >= inicioDoDia(inicio) && dd <= inicioDoDia(fim)) {
        if (d.pessoa === "douglas") somaD += d.ingles_minutos || 0;
        if (d.pessoa === "mayara") somaM += d.ingles_minutos || 0;
      }
    });
    inglesDouglas.push(somaD);
    inglesMayara.push(somaM);
  }

  const semanasGrav = [...estado.semanas].sort((a, b) => a.semana - b.semana);
  const labelsGrav = semanasGrav.map((s) => `S${s.semana}`);
  const mapaHumor = { otimo: 5, bom: 4, neutro: 3, dificil: 2, muito_dificil: 1 };
  const dadosHumor = semanasGrav.map((s) => mapaHumor[s.humor] || null);

  const distTrabalho = estado.sessoes.filter((s) => s.pessoa === p && s.categoria === "trabalho").length;
  const distEstudo = estado.sessoes.filter((s) => s.pessoa === p && s.categoria === "estudo").length;
  const distIngles = estado.sessoes.filter((s) => s.pessoa === p && s.categoria === "ingles").length;

  $("#tela-historico").innerHTML = `
    <div class="stagger">
      <div class="mb-4">
        <h2 class="fonte-display text-2xl font-bold">Nossa evolução 📈</h2>
        <p class="text-sm" style="color:var(--muted)">Sem cobrança, só carinho pelos passos dados.</p>
      </div>

      <div class="cartao mb-3">
        <p class="text-xs font-extrabold uppercase tracking-wider mb-3" style="color:var(--muted)">
          ${escaparHTML(nomePessoa(p))} · ${nomeMes} ${ano}
        </p>
        <div class="calendario-grid mb-2">
          ${["D","S","T","Q","Q","S","S"].map((x) => `<div class="text-center text-[0.6rem] font-extrabold" style="color:var(--muted)">${x}</div>`).join("")}
          ${celulas}
        </div>
        <div class="flex items-center justify-center gap-3 mt-3 text-[0.62rem] font-bold" style="color:var(--muted)">
          <span class="flex items-center gap-1"><span class="w-3 h-3 rounded" style="background:var(--surface-2); border:1px solid var(--borda)"></span>sem registro</span>
          <span class="flex items-center gap-1"><span class="w-3 h-3 rounded" style="background:rgba(168,216,200,.62)"></span>parcial</span>
          <span class="flex items-center gap-1"><span class="w-3 h-3 rounded" style="background:rgba(111,191,155,.85)"></span>lindo dia</span>
        </div>
      </div>

      <div class="flex gap-3 mb-3">${streaksHTML}</div>

      <div class="cartao mb-3">
        <p class="text-xs font-extrabold uppercase tracking-wider mb-3" style="color:var(--muted)">💧 Água nos últimos 30 dias</p>
        <div style="height:190px"><canvas id="grafico-agua"></canvas></div>
      </div>

      <div class="cartao mb-3">
        <p class="text-xs font-extrabold uppercase tracking-wider mb-3" style="color:var(--muted)">📚 Minutos de inglês por semana</p>
        <div style="height:190px"><canvas id="grafico-ingles"></canvas></div>
      </div>

      <div class="cartao mb-3">
        <p class="text-xs font-extrabold uppercase tracking-wider mb-3" style="color:var(--muted)">🍅 Meus focos por categoria</p>
        <div style="height:190px"><canvas id="grafico-pomodoro"></canvas></div>
      </div>

      <div class="cartao mb-6">
        <p class="text-xs font-extrabold uppercase tracking-wider mb-1" style="color:var(--muted)">💗 Linha do tempo emocional da gestação</p>
        <p class="text-[0.66rem] mb-3" style="color:var(--muted)">1 = muito difícil · 5 = ótimo</p>
        ${estado.semanas.length
          ? `<div style="height:200px"><canvas id="grafico-humor"></canvas></div>`
          : `<p class="text-sm" style="color:var(--muted)">Ainda não temos semanas registradas. Elas aparecem aqui conforme forem salvas 💗</p>`}
      </div>
    </div>
  `;

  Object.values(estado.charts).forEach((c) => { try { c.destroy(); } catch (e) { /* silencioso */ } });
  estado.charts = {};

  const corTexto = getComputedStyle(document.documentElement).getPropertyValue("--muted").trim() || "#7A7489";
  const corGrade = getComputedStyle(document.documentElement).getPropertyValue("--borda").trim() || "rgba(0,0,0,.08)";
  const fontePadrao = { family: "Nunito", size: 11, weight: "600" };
  const opcoesBase = {
    responsive: true, maintainAspectRatio: false,
    interaction: { mode: "index", intersect: false },
    plugins: {
      legend: { labels: { color: corTexto, font: fontePadrao, boxWidth: 10, boxHeight: 10, usePointStyle: true } },
      tooltip: { titleFont: fontePadrao, bodyFont: fontePadrao, padding: 10, cornerRadius: 10, displayColors: true }
    },
    scales: {
      x: { ticks: { color: corTexto, font: fontePadrao, maxRotation: 0, autoSkipPadding: 14 }, grid: { display: false } },
      y: { ticks: { color: corTexto, font: fontePadrao }, grid: { color: corGrade }, beginAtZero: true }
    }
  };

  const cvAgua = $("#grafico-agua");
  if (cvAgua) {
    estado.charts.agua = new Chart(cvAgua, {
      type: "line",
      data: {
        labels: labels30.map(formatarDataCurta),
        datasets: [
          { label: nomePessoa("douglas"), data: aguaDouglas, borderColor: "#4A90D9", backgroundColor: "rgba(74,144,217,0.12)", fill: true, tension: 0.36, spanGaps: true, pointRadius: 0, borderWidth: 2.5 },
          { label: nomePessoa("mayara"), data: aguaMayara, borderColor: "#E08AA6", backgroundColor: "rgba(224,138,166,0.12)", fill: true, tension: 0.36, spanGaps: true, pointRadius: 0, borderWidth: 2.5 }
        ]
      },
      options: opcoesBase
    });
  }

  const cvIngles = $("#grafico-ingles");
  if (cvIngles) {
    estado.charts.ingles = new Chart(cvIngles, {
      type: "bar",
      data: {
        labels: semanasLabels,
        datasets: [
          { label: nomePessoa("douglas"), data: inglesDouglas, backgroundColor: "#4A90D9", borderRadius: 8, maxBarThickness: 22 },
          { label: nomePessoa("mayara"), data: inglesMayara, backgroundColor: "#E08AA6", borderRadius: 8, maxBarThickness: 22 }
        ]
      },
      options: opcoesBase
    });
  }

  const cvPomo = $("#grafico-pomodoro");
  if (cvPomo) {
    estado.charts.pomodoro = new Chart(cvPomo, {
      type: "doughnut",
      data: {
        labels: ["Trabalho", "Estudo", "Inglês"],
        datasets: [{ data: [distTrabalho, distEstudo, distIngles], backgroundColor: ["#4A90D9", "#A8D8C8", "#E08AA6"], borderWidth: 0, hoverOffset: 6 }]
      },
      options: {
        responsive: true, maintainAspectRatio: false, cutout: "62%",
        plugins: {
          legend: { position: "bottom", labels: { color: corTexto, font: fontePadrao, boxWidth: 10, boxHeight: 10, usePointStyle: true, padding: 14 } },
          tooltip: { titleFont: fontePadrao, bodyFont: fontePadrao, padding: 10, cornerRadius: 10 }
        }
      }
    });
  }

  const cvHumor = $("#grafico-humor");
  if (cvHumor) {
    estado.charts.humor = new Chart(cvHumor, {
      type: "line",
      data: {
        labels: labelsGrav,
        datasets: [{
          label: "Humor dela", data: dadosHumor,
          borderColor: "#E08AA6", backgroundColor: "rgba(224,138,166,0.16)",
          fill: true, tension: 0.38, spanGaps: true,
          pointRadius: 5, pointBackgroundColor: "#E08AA6", pointBorderColor: "#fff", pointBorderWidth: 2, borderWidth: 2.5
        }]
      },
      options: {
        ...opcoesBase,
        scales: {
          x: { ticks: { color: corTexto, font: fontePadrao }, grid: { display: false } },
          y: {
            min: 1, max: 5,
            ticks: { color: corTexto, font: fontePadrao, stepSize: 1, callback: (v) => ({ 1: "😢", 2: "😔", 3: "😐", 4: "🙂", 5: "😄" }[v] || "") },
            grid: { color: corGrade }
          }
        }
      }
    });
  }
}

    const novo = (localStorage.getItem(CHAVE_TEMA) || "light") === "dark" ? "light" : "dark";
    aplicarTema(novo);
    btnTema.classList.toggle("ativo", novo === "dark");
  });

  const btnNotif = $("#cfg-notificacoes");
  btnNotif.classList.toggle("ativo", typeof Notification !== "undefined" && Notification.permission === "granted");

    if (typeof Notification === "undefined") { toast("Esse navegador não suporta notificações 💙"); return; }
    try {
      const perm = await Notification.requestPermission();
      btnNotif.classList.toggle("ativo", perm === "granted");
      if (perm === "granted") {
        toast("Notificações ligadas 🔔");
        notificarNavegador("Tudo pronto! 💙", "Vamos cuidar da nossa rotina juntinhos.");
      } else {

  $("#cfg-salvar").addEventListener("click", async () => {

      meta_agua_ml: { douglas: Number($("#cfg-agua-douglas").value) || 2500, mayara: Number($("#cfg-agua-mayara").value) || 2500 },

      meta_dormir: { douglas: $("#cfg-dormir-douglas").value || "23:00", mayara: $("#cfg-dormir-mayara").value || "22:30" },
      meta_ingles_min: { douglas: Number($("#cfg-ingles-douglas").value) || 20, mayara: Number($("#cfg-ingles-mayara").value) || 15 },
      meta_pomodoros: { douglas: Number($("#cfg-pomo-douglas").value) || 4, mayara: Number($("#cfg-pomo-mayara").value) || 3 },
      horarios_refeicao: {
        cafe: $("#cfg-cafe").value || "07:00",
        almoco: $("#cfg-almoco").value || "12:30",
        jantar: $("#cfg-jantar").value || "19:30"
      },
      pomodoro_minutos: Number($("#cfg-pomo-min").value) || 25,
      pausa_curta_minutos: Number($("#cfg-pausa-curta").value) || 5,
      pausa_longa_minutos: Number($("#cfg-pausa-longa").value) || 15
    };

    if (juntosVal) dados.data_juntos = new Date(`${juntosVal}T00:00:00`);

    const ok = await salvarConfig(dados, "Configurações salvas 💚");
    if (ok) {
      Sons.salvar();
      vibrar([18, 40, 18]);
      if (!estado.pomodoro.rodando && estado.pomodoro.modo !== "pausa") definirModoPomodoro(estado.pomodoro.modo);
      atualizarCabecalho();
    }

  $("#cfg-exportar").addEventListener("click", () => {
    const backup = {
      app: APP_CONFIG.nome, versao: APP_CONFIG.versao,
      exportado_em: new Date().toISOString(),

      preparacao_papai: estado.preparacao, sessoes_pomodoro: estado.sessoes
    };
    try {
      const blob = new Blob([JSON.stringify(backup, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);

      a.href = url;
      a.download = `nossa-rotina-viva-backup-${hojeISO()}.json`;
      document.body.appendChild(a);

service cloud.firestore {

}</pre>

  $("#cfg-logout").addEventListener("click", sair);

      "Continuar"

    if (!ok1) return;
    const ok2 = await confirmar(
      "Tem certeza mesmo?",
      "Última confirmação. Depois de apagar, não conseguimos recuperar.",
      "Apagar tudo"
    );
    if (!ok2) return;

      const colecoes = ["dias", "semanas_gravidez", "preparacao_papai", "sessoes_pomodoro"];
      for (const nome of colecoes) {
        const snap = await getDocs(collection(db, nome));
        const docs = snap.docs;
        for (let i = 0; i < docs.length; i += 400) {
          const lote = writeBatch(db);
          docs.slice(i, i + 400).forEach((d) => lote.delete(d.ref));
          await lote.commit();
        }
      }
      await deleteDoc(REF_CONFIG());
      sessionStorage.removeItem(CHAVE_SESSAO);
      estado.pessoa = null;
      toast("Tudo apagado. Vamos recomeçar com carinho 💙", 3200);
      setTimeout(() => window.location.reload(), 1400);

/* ============================================================
   21. TEMA
   ============================================================ */
function aplicarTema(tema) {
  const escuro = tema === "dark";
  document.documentElement.classList.toggle("dark", escuro);
  document.documentElement.classList.toggle("light", !escuro);
  localStorage.setItem(CHAVE_TEMA, tema);
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", escuro ? "#14121C" : "#F6F3FB");
  const btn = $("#btn-tema");
  if (btn) {
    btn.innerHTML = escuro ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-solid fa-moon"></i>';
  }
}

/* ============================================================
   22. NOTIFICAÇÕES E LEMBRETES
   ============================================================ */
function notificarNavegador(titulo, corpo) {
  if (typeof Notification === "undefined") return;
  if (Notification.permission !== "granted") return;
  try {
    new Notification(titulo, { body: corpo, icon: gerarIconeDataURL(), badge: gerarIconeDataURL() });
  } catch (e) { /* silencioso */ }
}

let intervaloLembretes = null;
function iniciarLembretes() {
  if (intervaloLembretes) clearInterval(intervaloLembretes);
  const cfg = estado.config;
  if (!cfg) return;

  let ultimoLembreteAgua = 0;
  const ultimaRefeicaoAvisada = {};
  let ultimoLembreteDormir = "";

  intervaloLembretes = setInterval(() => {
    if (!estado.pessoa) return;
    if (typeof Notification === "undefined" || Notification.permission !== "granted") return;

    const agora = new Date();
    const hhmm = agoraHHMM();
    const dia = obterDia(estado.pessoa, hojeISO()) || {};

    const agoraMs = Date.now();
    if (agoraMs - ultimoLembreteAgua > 2 * 60 * 60 * 1000) {
      if ((dia.agua_ml || 0) < metaAgua(estado.pessoa) && agora.getHours() >= 8 && agora.getHours() <= 21) {
        notificarNavegador("Hora de beber água 💧", "Um copinho agora faz diferença. Você merece esse cuidado.");
        ultimoLembreteAgua = agoraMs;
      }
    }

    const refeicoes = cfg.horarios_refeicao || {};
    const mapaRefeicao = [
      { id: "cafe", hora: refeicoes.cafe || "07:00", msg: "Hora do café ☕", corpo: "Um bom começo pra um dia gentil." },
      { id: "almoco", hora: refeicoes.almoco || "12:30", msg: "Hora do almoço 🍽️", corpo: "Come com calma, sem pressa." },
      { id: "jantar", hora: refeicoes.jantar || "19:30", msg: "Hora do jantar 🍲", corpo: "Comida quentinha e boa companhia." }
    ];
    mapaRefeicao.forEach((r) => {
      const [h, m] = r.hora.split(":").map(Number);
      if (agora.getHours() === h && Math.abs(agora.getMinutes() - m) < 2) {
        const chave = `${hojeISO()}_${r.id}`;
        if (!ultimaRefeicaoAvisada[chave]) {
          const feito = (dia.refeicoes || []).some((x) => x.tipo === r.id);
          if (!feito) {
            notificarNavegador(r.msg, r.corpo);
            ultimaRefeicaoAvisada[chave] = true;
          }
        }
      }
    });

    const metaDormir = (cfg.meta_dormir && cfg.meta_dormir[estado.pessoa]) || "23:00";
    const chaveDormir = `${hojeISO()}_dormir`;
    if (hhmm === metaDormir && ultimoLembreteDormir !== chaveDormir) {
      notificarNavegador("Vamos dormir? 😴", "Amanhã a gente continua. Descansa bem.");
      ultimoLembreteDormir = chaveDormir;
    }

    const chavePomo = `${hojeISO()}_pomo15`;
    if (agora.getHours() === 15 && agora.getMinutes() < 2 && !ultimaRefeicaoAvisada[chavePomo]) {
      const totalPomo = (dia.pomodoros_trabalho || 0) + (dia.pomodoros_estudo || 0);
      if (totalPomo < metaPomodoros(estado.pessoa)) {
        notificarNavegador("Que tal um Pomodoro agora? 🍅", "25 minutinhos de foco e depois um café.");
        ultimaRefeicaoAvisada[chavePomo] = true;
      }
    }
  }, 60000);
}

/* ============================================================
   23. PWA
   ============================================================ */
function gerarIconeDataURL() {
  try {
    const canvas = document.createElement("canvas");
    canvas.width = 512; canvas.height = 512;
    const ctx = canvas.getContext("2d");
    const grad = ctx.createLinearGradient(0, 0, 512, 512);
    grad.addColorStop(0, "#F6DDE5"); grad.addColorStop(0.5, "#E8DEF7"); grad.addColorStop(1, "#D8EFE7");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 512, 512);
    ctx.fillStyle = "rgba(255,255,255,0.55)";
    ctx.beginPath();
    ctx.arc(256, 256, 190, 0, Math.PI * 2);
    ctx.fill();
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = "150px serif";
    ctx.fillText("💙", 178, 236);
    ctx.fillText("💗", 334, 236);
    ctx.font = "bold 58px Nunito, sans-serif";
    ctx.fillStyle = "#4A3F63";
    ctx.fillText("Rotina", 256, 372);
    return canvas.toDataURL("image/png");
  } catch (e) { return ""; }
}

function registrarPWA() {
  try {
    const icone = gerarIconeDataURL();
    const manifest = {
      name: "Nossa Rotina Viva", short_name: "Rotina Viva",
      description: "Um cantinho nosso pra crescer juntos 💙💗",
      start_url: ".", scope: ".", display: "standalone", orientation: "portrait",
      background_color: "#F6F3FB", theme_color: "#C9B8E8", lang: "pt-BR",
      icons: icone ? [
        { src: icone, sizes: "192x192", type: "image/png", purpose: "any" },
        { src: icone, sizes: "512x512", type: "image/png", purpose: "any" },
        { src: icone, sizes: "512x512", type: "image/png", purpose: "maskable" }
      ] : []
    };
    const blob = new Blob([JSON.stringify(manifest)], { type: "application/manifest+json" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("link");
    link.rel = "manifest"; link.href = url;
    document.head.appendChild(link);

    if (icone) {
      const apple = document.createElement("link");
      apple.rel = "apple-touch-icon"; apple.href = icone;
      document.head.appendChild(apple);
      const fav = document.createElement("link");
      fav.rel = "icon"; fav.type = "image/png"; fav.href = icone;
      document.head.appendChild(fav);
    }
  } catch (e) { /* silencioso */ }
}

/* ============================================================
   24. BLOQUEIO DE GESTOS
   ============================================================ */
function bloquearGestos() {
  ["gesturestart", "gesturechange", "gestureend"].forEach((ev) => {
    document.addEventListener(ev, (e) => e.preventDefault(), { passive: false });
  });
  let ultimoToque = 0;
  document.addEventListener("touchend", (e) => {
    const agora = Date.now();
    if (agora - ultimoToque <= 320) e.preventDefault();
    ultimoToque = agora;
  }, { passive: false });
  document.addEventListener("touchmove", (e) => {
    if (e.touches.length > 1) e.preventDefault();
  }, { passive: false });
  document.addEventListener("contextmenu", (e) => e.preventDefault());
  document.addEventListener("wheel", (e) => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
  document.addEventListener("keydown", (e) => {
    if ((e.ctrlKey || e.metaKey) && ["+", "-", "=", "0"].includes(e.key)) e.preventDefault();
  });
}

/* ============================================================
   27. BOOT
   ============================================================ */
async function boot() {
  aplicarTema(localStorage.getItem(CHAVE_TEMA) || "light");
  registrarPWA();
  bloquearGestos();

  const dica = $("#loading-dica");
  if (dica) dica.textContent = "";

  if (!FIREBASE_CONFIGURADO) {
    $("#tela-loading").classList.add("oculto");
    $("#tela-login").classList.add("oculto");
    $("#app").classList.add("oculto");
    mostrarTelaSetup();
    return;
  }

  if (!app || !auth || !db) {
    $("#tela-loading").classList.add("oculto");
    $("#tela-login").classList.remove("oculto");
    const erro = $("#login-erro");
    if (erro) {
      erro.textContent = "Não consegui iniciar o Firebase. Confere as credenciais 💙";
      erro.classList.remove("oculto");
    }
    return;
  }

  /* Timeout de segurança: se em 15s o app não carregou, mostra o login
     com uma mensagem clara em vez de travar em "Carregando..." */
  const timerSeguranca = setTimeout(() => {
    const loading = $("#tela-loading");
    if (loading && !loading.classList.contains("oculto")) {
      loading.classList.add("oculto");
      $("#tela-login").classList.remove("oculto");
      const erro = $("#login-erro");
      if (erro) {
        erro.textContent = "Demorou mais que o normal. Confere a internet e as regras do Firestore 💙";
        erro.classList.remove("oculto");
      }
    }
  }, 15000);

  try {
    const usuario = await garantirAutenticacao();
    if (!usuario) {
      clearTimeout(timerSeguranca);
      $("#tela-loading").classList.add("oculto");
      $("#tela-login").classList.remove("oculto");
      toast("Não consegui conectar. Confere a internet e as credenciais 💙", 4000);
      return;
    }
    iniciarOuvintes();
    /* O timer de segurança é limpo quando a config chega no onSnapshot */
    const vigia = setInterval(() => {
      if (estado.configCarregada) {
        clearTimeout(timerSeguranca);
        clearInterval(vigia);
      }
    }, 500);
  } catch (e) {
    clearTimeout(timerSeguranca);
    $("#tela-loading").classList.add("oculto");
    $("#tela-login").classList.remove("oculto");
    toast("Não consegui conectar. Confere a internet 💙", 4000);
  }
}

boot().then(() => {
  const esperar = setInterval(() => {
    if (estado.config) {
      clearInterval(esperar);
      iniciarLembretes();
    }
  }, 1000);
});

setInterval(() => {
  if (estado.pessoa) {
    atualizarCabecalho();
    verificarAvisosDaOutraPessoa();
  }
}, 60000);
